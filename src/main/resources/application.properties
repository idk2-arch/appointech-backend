# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiracion-ms=86400000
spring.application.name=appointech-backend

# Google OAuth
google.client-id=807071502568-l82mul3juccjja49frlrhfia92pgqha7.apps.googleusercontent.com

# Mapas: distancia por carretera con OpenRouteService (ors) o linea recta (haversine)
mapas.proveedor=ors
ors.api-key=${ORS_API_KEY:}
ors.base-url=https://api.heigit.org
ors.matrix-path=/openrouteservice/v2/matrix/driving-car
ors.auth-prefix=
ors.timeout-conexion-ms=3000
ors.timeout-lectura-ms=5000

# Velocidad media usada solo para estimar minutos cuando se usa Haversine
mapas.haversine.velocidad-kmh=${HAVERSINE_VELOCIDAD_KMH:40}

# Agenda del tecnico
ruta.margen-minutos=${RUTA_MARGEN_MINUTOS:0}
ruta.tolerancia-retraso-minutos=${RUTA_TOLERANCIA_MINUTOS:5}
app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

# Detras del balanceador (nginx/ingress): respeta X-Forwarded-Host/Port/Proto. Valores: framework, native o none.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# Contacto del administrador para clientes fuera de cobertura (respaldo si la base de datos no tiene uno)
contacto.admin.telefono=${CONTACTO_ADMIN_TELEFONO:}

# Almacenamiento de objetos compatible con S3 (fotos de perfil); todo por entorno, sin claves en el codigo
almacenamiento.endpoint=${ALMACENAMIENTO_ENDPOINT:}
almacenamiento.access-key=${ALMACENAMIENTO_ACCESS_KEY:}
almacenamiento.secret-key=${ALMACENAMIENTO_SECRET_KEY:}
almacenamiento.bucket=${ALMACENAMIENTO_BUCKET:fotos-perfil}
almacenamiento.region=${ALMACENAMIENTO_REGION:us-east-1}

# Pre-diagnostico con IA (Groq, API compatible con OpenAI); sin GROQ_API_KEY la funcion queda "no disponible"
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.timeout-ms=${GROQ_TIMEOUT_MS:6000}
groq.max-tokens=1024

# Pagos: pasarela (wompi por defecto, nunca la simulada; simulada solo con PASARELA_PAGOS=simulada explicito), resultado de la simulada, umbral de diferencia cotizado/final (%) y pagina de retorno
pagos.pasarela=${PASARELA_PAGOS:wompi}
pagos.simulada.aprobar=${PASARELA_SIMULADA_APROBAR:true}
pagos.umbral-diferencia-porcentaje=${PAGOS_UMBRAL_DIFERENCIA_PORCENTAJE:20}
pagos.url-retorno=${PAGOS_URL_RETORNO:http://localhost:4200/cliente/pago/resultado}

# Calificaciones: dias, desde que la cita se finaliza, durante los que el cliente puede calificar
calificacion.plazo-dias=${CALIFICACION_PLAZO_DIAS:30}
