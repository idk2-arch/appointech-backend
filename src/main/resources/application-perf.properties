# Perfil "perf": entorno de pruebas de carga aislado (perf/docker-compose.perf.yml). Todo por variables de entorno.
# Se activa con SPRING_PROFILES_ACTIVE=perf; sobre application.properties solo cambia lo indicado aqui.

# Sin ruido de SQL en consola: medir con show-sql distorsiona los tiempos
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Migraciones normales + datos de carga (db/perf, fuera de db/migration; nunca se cargan sin este perfil)
spring.flyway.locations=classpath:db/migration,classpath:db/perf

# Pool de conexiones y Tomcat: parametrizables para ver cuando se agotan en la prueba de estres
spring.datasource.hikari.pool-name=perf-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:5000}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
# El estado del pool (total/active/idle/waiting) se imprime cada 30 s a stdout
logging.level.com.zaxxer.hikari.pool.HikariPool=DEBUG

# Servicios externos desactivados: distancias por linea recta, sin Groq, sin Google, sin correo (NOTIFICACIONES_URL vacia)
mapas.proveedor=haversine
groq.api-key=
google.client-id=perf-sin-google
pagos.pasarela=simulada

# Umbral (ms) a partir del cual la medicion de tiempos registra [LENTO]
perf.umbral-lento-ms=${PERF_UMBRAL_LENTO_MS:300}
