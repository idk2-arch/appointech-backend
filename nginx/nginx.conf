# Puerto externo con el que el cliente llego al balanceador (el de $http_host, p. ej. 8080). Si el Host no trae
# puerto se asume 80. Spring lo usa junto con X-Forwarded-Host para armar URLs absolutas (p. ej. el servidor de Swagger).
map $http_host $puerto_externo {
    ~:(?<puerto>\d+)$ $puerto;
    default           80;
}

# Si ya hay un proxy delante que termina TLS (ingress, CDN), se respeta su X-Forwarded-Proto; si no, el del esquema local.
map $http_x_forwarded_proto $protocolo_externo {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;

    resolver 127.0.0.11 valid=10s;
    set $servidor_backend http://backend:8080;

    # Fotos de perfil y de cita: el JSON en base64 pesa ~33 % mas que la imagen (maximo 1 MB), por eso se sube el limite de 1m.
    location ~ ^/api/(perfil/foto|admin/usuarios/[0-9]+/foto|cliente/citas/[0-9]+/fotos)$ {
        client_max_body_size 2m;
        proxy_pass $servidor_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $puerto_externo;
        proxy_set_header X-Forwarded-Proto $protocolo_externo;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass $servidor_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $puerto_externo;
        proxy_set_header X-Forwarded-Proto $protocolo_externo;
        proxy_set_header Authorization $http_authorization;
    }
}
