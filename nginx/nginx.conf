server {
    listen 80;

    resolver 127.0.0.11 valid=10s;
    set $servidor_backend http://backend:8080;

    # Fotos de perfil y de cita: el JSON en base64 pesa ~33 % mas que la imagen (maximo 1 MB), por eso se sube el limite de 1m.
    location ~ ^/api/(perfil/foto|admin/usuarios/[0-9]+/foto|cliente/citas/[0-9]+/fotos)$ {
        client_max_body_size 2m;
        proxy_pass $servidor_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass $servidor_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
}
