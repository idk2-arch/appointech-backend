spring.application.name=microservicio-notificaciones
server.port=8081
jwt.secret=${JWT_SECRET}

# Correo SMTP (12 factores: todo por variables de entorno; vacio = el envio falla con un WARN y la API sigue respondiendo)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notificaciones.correo.remitente=${MAIL_FROM:}
