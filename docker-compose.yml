services:
  balanceador:
    image: nginx:1.27-alpine
    container_name: appointech-balanceador
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PUERTO_EXTERNO_API:-8080}:80"

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - notificaciones
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5432/appointech}
      DB_USER: ${DB_USER:-appointech}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICACIONES_URL: http://notificaciones:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"

  notificaciones:
    build: ./microservicio-notificaciones
    container_name: appointech-notificaciones
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8081"
    ports:
      - "${PUERTO_EXTERNO_NOTIFICACIONES:-8081}:8081"
