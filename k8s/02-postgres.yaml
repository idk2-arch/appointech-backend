{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "postgres",
        "namespace": "appointech"
      },
      "spec": {
        "selector": {
          "app": "postgres"
        },
        "ports": [
          {
            "port": 5432,
            "targetPort": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "postgres",
        "namespace": "appointech"
      },
      "spec": {
        "serviceName": "postgres",
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "postgres"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "postgres"
            }
          },
          "spec": {
            "nodeSelector": {
              "kubernetes.io/arch": "amd64"
            },
            "containers": [
              {
                "name": "postgres",
                "image": "postgres:15-alpine",
                "env": [
                  {
                    "name": "POSTGRES_DB",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "appointech-config",
                        "key": "DB_NAME"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_USER",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "appointech-config",
                        "key": "DB_USER"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "appointech-secretos",
                        "key": "DB_PASSWORD"
                      }
                    }
                  }
                ],
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "resources": {
                  "requests": {
                    "memory": "256Mi",
                    "cpu": "100m"
                  },
                  "limits": {
                    "memory": "768Mi",
                    "cpu": "500m"
                  }
                },
                "startupProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-c",
                      "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                    ]
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 30
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-c",
                      "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                    ]
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5
                },
                "livenessProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-c",
                      "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                    ]
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 6
                },
                "volumeMounts": [
                  {
                    "name": "datos",
                    "mountPath": "/var/lib/postgresql/data",
                    "subPath": "pgdata"
                  }
                ]
              }
            ]
          }
        },
        "volumeClaimTemplates": [
          {
            "metadata": {
              "name": "datos"
            },
            "spec": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "storageClassName": "local-path",
              "resources": {
                "requests": {
                  "storage": "5Gi"
                }
              }
            }
          }
        ]
      }
    }
  ]
}
