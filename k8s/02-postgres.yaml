apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: appointech
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: appointech
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: appointech-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appointech-secretos
                  key: DB_PASSWORD
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: appointech
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
