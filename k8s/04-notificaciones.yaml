{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "notificaciones",
        "namespace": "appointech"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "RollingUpdate",
          "rollingUpdate": {
            "maxSurge": 0,
            "maxUnavailable": 1
          }
        },
        "selector": {
          "matchLabels": {
            "app": "notificaciones"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "notificaciones"
            }
          },
          "spec": {
            "nodeSelector": {
              "kubernetes.io/arch": "amd64"
            },
            "containers": [
              {
                "name": "notificaciones",
                "image": "ghcr.io/idk2-arch/appointech-backend-notificaciones:latest",
                "imagePullPolicy": "Always",
                "ports": [
                  {
                    "containerPort": 8081
                  }
                ],
                "env": [
                  {
                    "name": "MAIL_HOST",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "appointech-config",
                        "key": "MAIL_HOST"
                      }
                    }
                  },
                  {
                    "name": "MAIL_PORT",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "appointech-config",
                        "key": "MAIL_PORT"
                      }
                    }
                  },
                  {
                    "name": "MAIL_FROM",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "appointech-config",
                        "key": "MAIL_FROM"
                      }
                    }
                  },
                  {
                    "name": "JAVA_TOOL_OPTIONS",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "appointech-config",
                        "key": "JAVA_TOOL_OPTIONS"
                      }
                    }
                  },
                  {
                    "name": "TZ",
                    "valueFrom": {
                      "configMapKeyRef": {
                        "name": "appointech-config",
                        "key": "TZ"
                      }
                    }
                  },
                  {
                    "name": "JWT_SECRET",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "appointech-secretos",
                        "key": "JWT_SECRET"
                      }
                    }
                  },
                  {
                    "name": "MAIL_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "appointech-secretos",
                        "key": "MAIL_USER"
                      }
                    }
                  },
                  {
                    "name": "MAIL_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "appointech-secretos",
                        "key": "MAIL_PASSWORD"
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "memory": "256Mi",
                    "cpu": "50m"
                  },
                  "limits": {
                    "memory": "512Mi",
                    "cpu": "500m"
                  }
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/api/notificaciones/salud",
                    "port": 8081
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 3,
                  "failureThreshold": 60
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/api/notificaciones/salud",
                    "port": 8081
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/api/notificaciones/salud",
                    "port": 8081
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 3,
                  "failureThreshold": 6
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "notificaciones",
        "namespace": "appointech"
      },
      "spec": {
        "selector": {
          "app": "notificaciones"
        },
        "ports": [
          {
            "port": 8081,
            "targetPort": 8081
          }
        ]
      }
    }
  ]
}
