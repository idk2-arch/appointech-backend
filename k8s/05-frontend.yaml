{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "frontend-nginx",
        "namespace": "appointech"
      },
      "data": {
        "default.conf": "server {\n listen 80;\n root /usr/share/nginx/html;\n index index.html;\n add_header Cross-Origin-Opener-Policy \"same-origin-allow-popups\" always;\n location / { try_files $uri $uri/ /index.html; }\n location = /index.html { add_header Cache-Control \"no-cache\"; add_header Cross-Origin-Opener-Policy \"same-origin-allow-popups\" always; }\n location ~ ^/(ngsw.*|safety-worker.js|worker-basic.min.js)$ { add_header Cache-Control \"no-cache\"; add_header Cross-Origin-Opener-Policy \"same-origin-allow-popups\" always; }\n}\n"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "frontend",
        "namespace": "appointech"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "RollingUpdate",
          "rollingUpdate": {
            "maxSurge": 0,
            "maxUnavailable": 1
          }
        },
        "selector": {
          "matchLabels": {
            "app": "frontend"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "frontend"
            }
          },
          "spec": {
            "nodeSelector": {
              "kubernetes.io/arch": "amd64"
            },
            "containers": [
              {
                "name": "frontend",
                "image": "frontend-pendiente:latest",
                "imagePullPolicy": "Always",
                "ports": [
                  {
                    "containerPort": 80
                  }
                ],
                "env": [],
                "resources": {
                  "requests": {
                    "memory": "32Mi",
                    "cpu": "50m"
                  },
                  "limits": {
                    "memory": "128Mi",
                    "cpu": "500m"
                  }
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": 80
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 3,
                  "failureThreshold": 60
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": 80
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 3
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/",
                    "port": 80
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 3,
                  "failureThreshold": 6
                },
                "volumeMounts": [
                  {
                    "name": "nginx",
                    "mountPath": "/etc/nginx/conf.d/default.conf",
                    "subPath": "default.conf",
                    "readOnly": true
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "nginx",
                "configMap": {
                  "name": "frontend-nginx"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "frontend",
        "namespace": "appointech"
      },
      "spec": {
        "selector": {
          "app": "frontend"
        },
        "ports": [
          {
            "port": 80,
            "targetPort": 80
          }
        ]
      }
    }
  ]
}
