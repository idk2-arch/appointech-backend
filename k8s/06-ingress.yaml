{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "traefik.io/v1alpha1",
      "kind": "Middleware",
      "metadata": {
        "name": "https",
        "namespace": "appointech"
      },
      "spec": {
        "redirectScheme": {
          "scheme": "https",
          "permanent": true
        }
      }
    },
    {
      "apiVersion": "networking.k8s.io/v1",
      "kind": "Ingress",
      "metadata": {
        "name": "appointech-web",
        "namespace": "appointech",
        "annotations": {
          "traefik.ingress.kubernetes.io/router.entrypoints": "web",
          "traefik.ingress.kubernetes.io/router.middlewares": "appointech-https@kubernetescrd"
        }
      },
      "spec": {
        "ingressClassName": "traefik",
        "rules": [
          {
            "host": "appointech.duckdns.org",
            "http": {
              "paths": [
                {
                  "path": "/api",
                  "pathType": "Prefix",
                  "backend": {
                    "service": {
                      "name": "backend",
                      "port": {
                        "number": 80
                      }
                    }
                  }
                },
                {
                  "path": "/",
                  "pathType": "Prefix",
                  "backend": {
                    "service": {
                      "name": "frontend",
                      "port": {
                        "number": 80
                      }
                    }
                  }
                }
              ]
            }
          }
        ]
      }
    },
    {
      "apiVersion": "networking.k8s.io/v1",
      "kind": "Ingress",
      "metadata": {
        "name": "appointech-websecure",
        "namespace": "appointech",
        "annotations": {
          "traefik.ingress.kubernetes.io/router.entrypoints": "websecure",
          "cert-manager.io/cluster-issuer": "letsencrypt-staging",
          "traefik.ingress.kubernetes.io/router.tls": "true"
        }
      },
      "spec": {
        "ingressClassName": "traefik",
        "tls": [
          {
            "hosts": [
              "appointech.duckdns.org"
            ],
            "secretName": "appointech-tls"
          }
        ],
        "rules": [
          {
            "host": "appointech.duckdns.org",
            "http": {
              "paths": [
                {
                  "path": "/api",
                  "pathType": "Prefix",
                  "backend": {
                    "service": {
                      "name": "backend",
                      "port": {
                        "number": 80
                      }
                    }
                  }
                },
                {
                  "path": "/",
                  "pathType": "Prefix",
                  "backend": {
                    "service": {
                      "name": "frontend",
                      "port": {
                        "number": 80
                      }
                    }
                  }
                }
              ]
            }
          }
        ]
      }
    }
  ]
}
