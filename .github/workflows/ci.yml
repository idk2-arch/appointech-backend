name: CI-CD Backend

on:
  push:
    branches: [main, desarrollo, preproduccion]
  pull_request:
    branches: [main, desarrollo, preproduccion]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: appointech
          POSTGRES_USER: appointech
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointech -d appointech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/appointech
      DB_USER: appointech
      DB_PASSWORD: devpassword
      JWT_SECRET: clave-de-integracion-continua-con-mas-de-32-caracteres
      # Los PR desde forks no reciben secretos: SONAR_TOKEN llega vacio y se omite el analisis
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache de SonarQube Cloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Compilar y ejecutar pruebas
        if: ${{ env.SONAR_TOKEN == '' }}
        run: ./mvnw -B verify
      - name: Compilar, probar y analizar con SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  publicar-imagenes:
    needs: construir-y-probar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/desarrollo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Definir nombre de las imagenes
        run: |
          echo "IMAGEN_BACKEND=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> $GITHUB_ENV
          echo "IMAGEN_NOTIFICACIONES=ghcr.io/${GITHUB_REPOSITORY,,}-notificaciones" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN_BACKEND }}:latest
            ${{ env.IMAGEN_BACKEND }}:${{ github.sha }}
      - name: Publicar imagen del microservicio de notificaciones
        uses: docker/build-push-action@v6
        with:
          context: ./microservicio-notificaciones
          push: true
          tags: |
            ${{ env.IMAGEN_NOTIFICACIONES }}:latest
            ${{ env.IMAGEN_NOTIFICACIONES }}:${{ github.sha }}

  desplegar-kubernetes:
    needs: publicar-imagenes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar manifiestos
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG}" | base64 -d > ~/.kube/config
          kubectl apply -f k8s/
